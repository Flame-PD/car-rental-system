<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增租车记录</title>
    <style>
        .container { width: 500px; margin: 50px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 100px; }
        input, select { width: 250px; padding: 5px; }
        button { padding: 8px 20px; background-color: #28a745; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .cancel { background-color: #6c757d; margin-left: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>新增租车记录</h1>

    <form th:action="@{/admin/rent-records/add}" th:object="${record}" method="post">
        <div class="form-group">
            <label>选择车辆：</label>
            <select th:field="*{carId}" required>
                <option value="">-- 请选择 --</option>
                <option th:each="car : ${cars}" th:value="${car.id}"
                        th:text="${car.brand} + ' ' + ${car.model} + ' (' + ${car.plate} + ')'"></option>
            </select>
        </div>

        <div class="form-group">
            <label>租车人姓名：</label>
            <input type="text" th:field="*{customerName}" required>
        </div>

        <div class="form-group">
            <label>联系电话：</label>
            <input type="text" th:field="*{customerPhone}">
        </div>

        <div class="form-group">
            <button type="submit">保存</button>
            <a href="/admin/rent-records"><button type="button" class="cancel">取消</button></a>
        </div>
    </form>
</div>
</body>
</html>
