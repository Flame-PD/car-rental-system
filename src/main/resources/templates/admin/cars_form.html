<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>车辆表单</title>
    <style>
        .container {
            width: 500px;
            margin: 50px auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 100px;
        }
        input {
            width: 250px;
            padding: 5px;
        }
        button {
            padding: 8px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .cancel {
            background-color: #6c757d;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:if="${car.id == null}">新增车辆</h1>
    <h1 th:if="${car.id != null}">编辑车辆</h1>

    <form th:action="${car.id == null} ? '/admin/cars' : '/admin/cars/edit/' + ${car.id}"
          th:object="${car}" method="post">

        <div class="form-group">
            <label>车牌号：</label>
            <input type="text" th:field="*{plate}" required>
        </div>

        <div class="form-group">
            <label>品牌：</label>
            <input type="text" th:field="*{brand}">
        </div>

        <div class="form-group">
            <label>车型：</label>
            <input type="text" th:field="*{model}">
        </div>

        <div class="form-group">
            <label>日租金(元)：</label>
            <input type="number" step="0.01" th:field="*{pricePerDay}">
        </div>

        <div class="form-group">
            <button type="submit">保存</button>
            <a href="/admin/cars"><button type="button" class="cancel">取消</button></a>
        </div>
    </form>
</div>
</body>
</html>
