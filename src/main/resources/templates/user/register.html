<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-card {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .register-card h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .register-card input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .register-card input:focus {
            outline: none;
            border-color: #667eea;
        }
        .register-card button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .register-card button:hover {
            transform: translateY(-2px);
        }
        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .success {
            color: #28a745;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 5px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 3px;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #eee;
        }
        .demo-info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }
        .demo-info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
<div class="register-card">
    <h1>📝 注册新账号</h1>

    <form th:action="@{/user/register}" method="post">
        <div class="form-group">
            <label>用户名 *</label>
            <input type="text" name="username" placeholder="请输入用户名" required>
        </div>

        <div class="form-group">
            <label>密码 *</label>
            <input type="password" name="password" placeholder="请输入密码" required>
        </div>

        <div class="form-group">
            <label>真实姓名 *</label>
            <input type="text" name="realName" placeholder="请输入真实姓名" required>
        </div>

        <div class="form-group">
            <label>手机号</label>
            <input type="tel" name="phone" placeholder="请输入手机号">
        </div>

        <button type="submit">立即注册</button>

        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div th:if="${success}" class="success" th:text="${success}"></div>
    </form>

    <div class="login-link">
        已有账号？ <a href="/user/login">立即登录</a>
    </div>

    <hr>
    <div class="demo-info">
        <p>📌 注册后即可租车</p>
        <p>📌 租车时会自动使用你的真实姓名和手机号</p>
        <p>📌 管理员账号: admin / admin123</p>
    </div>
</div>
</body>
</html>
